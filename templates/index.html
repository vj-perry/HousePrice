<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UK House Price Explorer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1>UK House Price Explorer</h1>
      <p class="subtitle">Sold-price history from HM Land Registry's Price Paid Data, plotted over time.</p>
    </header>

    <form id="search-form" class="filter-row" autocomplete="off">
      <div class="mode-switch" role="tablist" aria-label="Search mode">
        <button type="button" class="mode-btn is-active" data-mode="property" role="tab" aria-selected="true">
          One property
        </button>
        <button type="button" class="mode-btn" data-mode="area" role="tab" aria-selected="false">
          Area trend
        </button>
      </div>

      <div class="fields" data-mode-fields="property">
        <label class="field">
          <span>Postcode</span>
          <input type="text" name="postcode" placeholder="e.g. SW1A 1AA" required>
        </label>
        <label class="field">
          <span>House number / name <em>(optional)</em></span>
          <input type="text" name="house" placeholder="e.g. 10">
        </label>
      </div>

      <div class="fields" data-mode-fields="area" hidden>
        <label class="field">
          <span>Postcode area/district</span>
          <input type="text" name="area" placeholder="e.g. SW1A">
        </label>
        <label class="field">
          <span>or town</span>
          <input type="text" name="town" placeholder="e.g. Cambridge">
        </label>
        <label class="field">
          <span>From</span>
          <input type="date" name="date_from">
        </label>
        <label class="field">
          <span>To</span>
          <input type="date" name="date_to">
        </label>
      </div>

      <button type="submit" class="submit-btn">Search</button>
    </form>

    <p id="status" class="status" role="status"></p>

    <section id="result-card" class="card" hidden>
      <div class="card-head">
        <h2 id="result-title"></h2>
        <button type="button" id="table-toggle" class="link-btn">Show table</button>
      </div>
      <div id="legend" class="legend" aria-hidden="true"></div>
      <div class="chart-wrap">
        <div id="chart-mount"></div>
        <div id="tooltip" class="tooltip" hidden></div>
      </div>
      <div id="table-wrap" class="table-wrap" hidden>
        <table id="data-table">
          <thead>
            <tr><th>Date</th><th>Price</th><th>Address</th><th>Type</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
