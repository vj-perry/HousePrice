<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UK House Price Explorer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1>UK House Price Explorer</h1>
      <p class="subtitle">Every recorded sale from HM Land Registry's Price Paid Data (1995 to today), plotted over time.</p>
    </header>

    <form id="search-form" class="filter-row" autocomplete="off">
      <label class="field">
        <span>Postcode</span>
        <input type="text" name="postcode" placeholder="e.g. SW1A 1AA or SW1A" required>
      </label>
      <label class="field field-grow">
        <span>Street name <em>(optional)</em></span>
        <input type="text" name="street" placeholder="e.g. Downing Street">
      </label>
      <button type="submit" class="submit-btn">Search</button>
    </form>

    <p id="status" class="status" role="status"></p>

    <section id="result-card" class="card" hidden>
      <div class="card-head">
        <h2 id="result-title"></h2>
      </div>
      <div id="legend" class="legend" aria-hidden="true"></div>
      <div class="chart-wrap">
        <div id="chart-mount"></div>
        <div id="tooltip" class="tooltip" hidden></div>
      </div>
      <div class="table-wrap">
        <table id="data-table">
          <thead>
            <tr><th>Date</th><th>Price</th><th>Address</th><th>Type</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
