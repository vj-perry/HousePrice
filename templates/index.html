<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UK House Price Explorer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1>UK House Price Explorer</h1>
      <p class="subtitle">Every recorded sale from HM Land Registry's Price Paid Data (1995 to today), plotted over time.</p>
    </header>

    <form id="search-form" class="filter-row" autocomplete="off">
      <label class="field field-grow">
        <span>Search</span>
        <input type="text" name="q" placeholder="Postcode, street, or both — e.g. 'SW1A 2AA', 'Downing Street', '10 Downing Street SW1A'" required>
      </label>
      <button type="submit" class="submit-btn">Search</button>
    </form>

    <p id="status" class="status" role="status"></p>

    <section id="result-card" class="card" hidden>
      <div class="card-head">
        <h2 id="result-title"></h2>
        <button type="button" id="map-toggle" class="link-btn">Show map</button>
      </div>
      <div class="chart-controls">
        <div id="legend" class="legend" aria-hidden="true"></div>
        <div id="chart-mode" class="chart-mode" role="group" aria-label="Chart value" hidden>
          <button type="button" data-mode="price" class="is-active" aria-pressed="true">Price</button>
          <button type="button" data-mode="sqm" aria-pressed="false">&pound;/m&sup2;</button>
        </div>
      </div>
      <div class="chart-wrap">
        <div id="chart-mount"></div>
        <div class="chart-zoom" role="group" aria-label="Chart zoom">
          <button type="button" id="chart-zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
          <button type="button" id="chart-zoom-out" title="Zoom out" aria-label="Zoom out">&minus;</button>
          <button type="button" id="chart-zoom-reset" title="Reset zoom" aria-label="Reset zoom">&#8634;</button>
        </div>
        <div id="tooltip" class="tooltip" hidden></div>
      </div>
      <p id="outlier-note" class="footnote" hidden></p>
      <div id="map-section" hidden>
        <div id="map"></div>
        <p id="map-note" class="map-note"></p>
      </div>
      <div class="table-wrap">
        <table id="data-table">
          <thead>
            <tr><th>Date</th><th>Price</th><th>Address</th><th>Type</th><th>Rooms</th><th>&pound;/m&sup2;</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="table-note" class="footnote" hidden></p>
    </section>
  </div>

  <script src="{{ url_for('static', filename='vendor/leaflet/leaflet.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
